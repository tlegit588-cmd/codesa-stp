<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier Storefront | CODEYSA-STP</title><meta name="description" content="Explore an approved CODEYSA-STP marketplace supplier and published products."><link rel="icon" href="assets/codeysa-stp-logo.webp"><link rel="stylesheet" href="styles.css">
<style>
.store-wrap{max-width:1100px;margin:auto}.store-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}.store-products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}.store-product{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.store-product img{width:100%;height:190px;object-fit:cover;background:#f1eee9;display:block}.store-product-body{padding:16px}.store-product-body p{color:var(--muted);font-size:.9rem}.store-empty{padding:24px;background:#fff;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.store-contact{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}@media(max-width:800px){.store-products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.store-products{grid-template-columns:1fr}}
</style></head>
<body>
<div class="topbar"><div class="container">CODEYSA-STP MARKETPLACE <span>Approved supplier storefront</span></div></div>
<header><div class="container nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/codeysa-stp-logo.webp" alt="CODEYSA-STP logo"><span class="brand-copy">CODEYSA-STP<small>SUPPLIER DIRECTORY</small></span></a><button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button><nav class="nav-links"><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a href="account.html">Account</a></nav><a class="nav-cta" href="marketplace.html">Browse marketplace</a></div></header>
<main class="section soft"><div class="container store-wrap"><div id="store-status" class="store-card" role="status" aria-live="polite">Loading supplier storefront…</div><section id="store-content" hidden><div class="store-card"><span class="pill">Approved marketplace supplier</span><h1 id="store-name"></h1><p id="store-location"></p><p id="store-description"></p><div id="store-contact" class="store-contact"></div></div><div class="section-head" style="margin-top:34px"><h2>Published products</h2><p>Only products approved for public display appear here.</p></div><div id="store-products" class="store-products"></div></section></div></main>
<footer><div class="container"><div class="footer-bottom">© <span data-year></span> CODEYSA-STP · São Tomé &amp; Príncipe</div></div></footer>
<script src="app.js"></script><script>
(()=>{const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const id=new URLSearchParams(location.search).get("id");const status=$('#store-status');if(!id){status.textContent="No supplier was selected. Return to the marketplace.";return;}fetch('/api/suppliers/'+encodeURIComponent(id)).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||"Storefront unavailable.");return d;}).then(d=>{status.hidden=true;$('#store-content').hidden=false;$('#store-name').textContent=d.supplier.business_name;$('#store-location').textContent=d.supplier.country||"";$('#store-description').textContent=d.supplier.description||"Supplier information has not been added yet.";const contact=$('#store-contact');if(d.supplier.phone)contact.insertAdjacentHTML('beforeend','<a class="btn btn-gold" href="https://wa.me/'+esc(d.supplier.phone.replace(/[^0-9]/g,''))+'" target="_blank" rel="noopener">Contact supplier on WhatsApp</a>');if(d.supplier.website&&/^https:\/\//i.test(d.supplier.website))contact.insertAdjacentHTML('beforeend','<a class="btn btn-outline" href="'+esc(d.supplier.website)+'" target="_blank" rel="noopener">Visit website</a>');const grid=$('#store-products');grid.innerHTML=d.products.map(p=>'<article class="store-product">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" loading="lazy" referrerpolicy="no-referrer">':'<div class="market-product-image produce" style="height:190px"><span>🇸🇹</span><small>CODEYSA MARKETPLACE</small></div>')+'<div class="store-product-body"><span class="market-product-category">'+esc(p.category)+'</span><h3>'+esc(p.name)+'</h3><p>'+esc(p.description)+'</p><small>'+esc(p.unit||"Details on request")+' · '+esc(p.origin||"")+'</small></div></article>').join('');if(!d.products.length)grid.innerHTML='<p class="store-empty">No published products are available yet.</p>';}).catch(e=>{status.textContent=e.message;});})();
</script></body></html>
